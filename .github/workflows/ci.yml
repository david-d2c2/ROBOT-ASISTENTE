name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: python -m unittest discover -s tests -v
      - name: Dependencias coherentes
        run: python -m pip check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Empaquetar ejecutable
        run: python -m PyInstaller --clean --noconfirm robot.spec
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path 'dist\RobotAsistente\*' -DestinationPath 'RobotAsistente-win64.zip'
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: RobotAsistente-win64.zip
